<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}NumPy MLP{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- Overlay that dims the page when sidebar is open on mobile -->
<div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="layout">

  <!-- Mobile top bar (only visible on small screens) -->
  <header class="mobile-header">
    <button class="hamburger" id="hamburger" onclick="toggleSidebar()" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <span class="mobile-title">NumPy MLP</span>
    <a href="{{ url_for('reset') }}"
       onclick="return confirm('Reset all training state and go back to home?')"
       style="font-size:0.78rem; color:#94a3b8; text-decoration:none; white-space:nowrap;">
      ↺ Reset
    </a>
  </header>

  <!-- Sidebar navigation -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h1>NumPy MLP</h1>
      <p>From scratch · No frameworks</p>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">Overview</div>
      <a href="{{ url_for('index') }}"
         class="nav-link {% if request.path == '/' %}active{% endif %}"
         onclick="closeSidebar()">
        <span class="step-dot">⌂</span>
        Home
      </a>

      <div class="nav-section">Steps</div>
      <a href="{{ url_for('data') }}"
         class="nav-link {% if request.path == '/data' %}active{% endif %}"
         onclick="closeSidebar()">
        <span class="step-dot">1</span>
        Data Loading
      </a>
      <a href="{{ url_for('train') }}"
         class="nav-link {% if request.path == '/train' %}active{% endif %}"
         onclick="closeSidebar()">
        <span class="step-dot">2</span>
        Batch Training
      </a>
      <a href="{{ url_for('evaluate') }}"
         class="nav-link {% if request.path == '/evaluate' %}active{% endif %}"
         onclick="closeSidebar()">
        <span class="step-dot">3</span>
        Evaluation
      </a>
      <a href="{{ url_for('compare') }}"
         class="nav-link {% if request.path == '/compare' %}active{% endif %}"
         onclick="closeSidebar()">
        <span class="step-dot">4</span>
        Batch vs Online
      </a>
      <a href="{{ url_for('relu') }}"
         class="nav-link {% if request.path == '/relu' %}active{% endif %}"
         onclick="closeSidebar()">
        <span class="step-dot">5</span>
        ReLU Network
      </a>
    </nav>

    <!-- Reset button at the bottom of the sidebar -->
    <div class="sidebar-footer">
      <a href="{{ url_for('reset') }}"
         class="btn-reset"
         onclick="return confirm('Reset all training state and go back to home?')">
        ↺ &nbsp;Reset app state
      </a>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main">
    {% block content %}{% endblock %}
  </main>

</div>

<script>
  function openSidebar() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("overlay").classList.add("visible");
    document.getElementById("hamburger").classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("overlay").classList.remove("visible");
    document.getElementById("hamburger").classList.remove("open");
    document.body.style.overflow = "";
  }

  function toggleSidebar() {
    var sidebar = document.getElementById("sidebar");
    if (sidebar.classList.contains("open")) {
      closeSidebar();
    } else {
      openSidebar();
    }
  }

  // Show a spinner and disable the submit button while the form is processing
  document.querySelectorAll("form").forEach(function(form) {
    form.addEventListener("submit", function() {
      var btn = form.querySelector(".btn-primary");
      if (btn) {
        var spinner = btn.querySelector(".spinner");
        if (spinner) { spinner.style.display = "block"; }
        btn.disabled = true;
        btn.style.opacity = "0.75";
      }
    });
  });
</script>

</body>
</html>
